name: Build and Publish Lokinet Docker Image

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get latest Lokinet version from upstream
        id: upstream_version
        run: |
          # Fetch the tag_name of the latest official release (e.g., v0.9.11)
          LATEST_TAG=$(curl -s https://api.github.com/repos/oxen-io/lokinet/releases/latest | jq -r .tag_name)
          # Remove the v prefix to make the image tag more standard (becomes 0.9.11)
          VERSION=${LATEST_TAG#v}
          echo "upstream_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Fetched Lokinet version: $VERSION"

      - name: Determine image version
        id: image_version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -n1)

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CURRENT_TAG="${GITHUB_REF_NAME}"

            if [ "$CURRENT_TAG" != "$LATEST_TAG" ]; then
              echo "Tag $CURRENT_TAG is not the latest version tag ($LATEST_TAG)"
              echo "build_needed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            VERSION=${CURRENT_TAG#v}
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "build_type=release" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Image release: $VERSION"
          else
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "build_type=edge" >> $GITHUB_OUTPUT
            echo "version=edge" >> $GITHUB_OUTPUT
            echo "Edge build from main"
          fi

      - name: Log in to the Container registry
        if: steps.image_version.outputs.build_needed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.image_version.outputs.build_needed == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image_version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.image_version.outputs.build_type == 'release' }}
          labels: |
            org.opencontainers.image.lokinet.version=${{ steps.upstream_version.outputs.upstream_version }}

      - name: Build and push Docker image
        if: steps.image_version.outputs.build_needed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build result notification
        run: |
          if [ "${{ steps.image_version.outputs.build_needed }}" = "true" ]; then
            echo "Build completed"
            echo "Type: ${{ steps.image_version.outputs.build_type }}"
            echo "Image version: ${{ steps.image_version.outputs.version }}"
            echo "Lokinet version: ${{ steps.upstream_version.outputs.upstream_version }}"
          else
            echo "Build skipped: tag is not the latest version"
          fi