name: Build and Publish Lokinet Docker Image

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: image_tags
        run: |
          COMMIT_SHA='${{ github.sha }}'
          MAIN_SHA="$(git rev-parse origin/main)"

          VERSION_TAG=$(git tag --points-at "$COMMIT_SHA" --list 'v*' --sort=-v:refname | head -n1)
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          TAGS='type=sha,format=short'$'\n''type=sha,format=long'

          if [ -n "$VERSION_TAG" ]; then
            TAGS="$TAGS"$'\n'"type=raw,value=${VERSION_TAG#v}"

            if [ "$VERSION_TAG" = "$LATEST_TAG" ]; then
              TAGS="$TAGS"$'\n''type=raw,value=latest'
            fi
          fi

          if [ "$COMMIT_SHA" = "$MAIN_SHA" ]; then
            TAGS="$TAGS"$'\n''type=raw,value=edge'
          fi

          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

          echo "Current commit: $COMMIT_SHA"
          echo "Main branch commit: $MAIN_SHA"
          echo "Current version tag: ${VERSION_TAG:-none}"
          echo "Latest version tag: ${LATEST_TAG:-none}"
          echo 'Image tags:'
          echo "$TAGS"

      - name: Get latest Lokinet version
        id: lokinet_version
        run: |
          # Fetch the tag_name of the latest official release
          TAG_NAME=$(curl -s https://api.github.com/repos/oxen-io/lokinet/releases/latest | jq -r .tag_name)
          VERSION=${TAG_NAME#v}
          echo "lokinet_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Fetched Lokinet version: $VERSION"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.lokinet.version=${{ steps.lokinet_version.outputs.lokinet_version }}
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
          annotations: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}

      - name: Get Git commit timestamp
        run: echo "GIT_COMMIT_TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push=true,rewrite-timestamp=true,compression=zstd,compression-level=22,force-compression=true,compatibility-version=20
          build-args: SOURCE_DATE_EPOCH=${{ env.GIT_COMMIT_TIMESTAMP }}
          no-cache: true
          provenance: false
        env:
          SOURCE_DATE_EPOCH: ${{ env.GIT_COMMIT_TIMESTAMP }}

      - name: Build result notification
        run: |
          echo 'Build completed'
          echo 'Image tags:'
          echo '${{ steps.image_tags.outputs.tags }}'
          echo 'Lokinet version: ${{ steps.lokinet_version.outputs.lokinet_version }}'