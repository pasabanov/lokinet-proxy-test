name: Build and Publish Lokinet Docker Image

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Determine image tags
        id: image_tags
        run: |
          CURRENT_SHA='${{ github.sha }}'
          LATEST_TAG=$(git tag --sort=-v:refname | head -n1)
          TAGS='type=sha,format=short'

          VERSION_TAG=$(git tag --points-at "$CURRENT_SHA" --list 'v*' | sort -V | tail -n1)

          if [ -n "$VERSION_TAG" ]; then
            VERSION=${VERSION_TAG#v}
            TAGS="$TAGS"$'\n'"type=raw,value=$VERSION"

            if [ "$VERSION_TAG" = "$LATEST_TAG" ]; then
              TAGS="$TAGS"$'\n'"type=raw,value=latest"
            fi
          fi

          if [ "$CURRENT_SHA" = "$(git rev-parse origin/main)" ]; then
            TAGS="$TAGS"$'\n'"type=raw,value=edge"
          fi

          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

          echo "Current commit: $CURRENT_SHA"
          echo "Latest version tag: $LATEST_TAG"
          echo "Current version tag: ${VERSION_TAG:-none}"
          echo 'Image tags:'
          echo "$TAGS"

      - name: Get latest Lokinet version
        id: lokinet_version
        run: |
          # Fetch the tag_name of the latest official release (e.g., v0.9.11)
          LATEST_TAG=$(curl -s https://api.github.com/repos/oxen-io/lokinet/releases/latest | jq -r .tag_name)
          # Remove the v prefix to make the image tag more standard (becomes 0.9.11)
          VERSION=${LATEST_TAG#v}
          echo "lokinet_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Fetched Lokinet version: $VERSION"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.lokinet.version=${{ steps.lokinet_version.outputs.lokinet_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build result notification
        run: |
          echo 'Build completed'
          echo 'Image tags:'
          echo '${{ steps.image_tags.outputs.tags }}'
          echo 'Lokinet version: ${{ steps.lokinet_version.outputs.lokinet_version }}'